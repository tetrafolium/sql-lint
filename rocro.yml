    - name: sql-lint_shell
      type: shell
      commands:
        - sudo apt-get update && sudo apt-get install -y nodejs npm
        - echo "+++ node .. $(node --version)"
        - echo "+++ npm .. $(npm --version)"
        - sudo npm install --global typescript
        - echo "+++ tsc .. $(tsc --version)"
        - sudo npm install --global sql-lint
        - echo "+++ sql-lint .. $(sql-lint --version)"
        - REPODIR="$(pwd)"
        - OUTDIR="${REPODIR}/.reports"
        - OUTFILE="${OUTDIR}/sqllint.issues"
        - echo +++ REPODIR is "${REPODIR}"
        - echo +++ OUTDIR is "${OUTDIR}"
        - echo +++ OUTFILE is "${OUTFILE}"
        - mkdir -p "${OUTDIR}"
        - ( find . -type f -name '*.sql' -print0 | xargs -0 -n 1 sql-lint --format simple ) > "${OUTFILE}" || true
        - ls -al "${OUTDIR}"
        - (echo "========" ; cat -n "${OUTFILE}" ; echo "========")
      artifacts:
        uploads:
          - path: '.reports/sqllint.issues'
      reports:
        - path: '.reports/sqllint.issues'
          format: {type: example, path: '.rocro/sqllint/issues.example'}
      thresholds: {num-issues: 999}

    # - name: yamllint_docker
    #   type: docker-build
    #   dockerfile: '.rocro/yamllint/Dockerfile'
