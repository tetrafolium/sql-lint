---
inspecode:

  # global:
  #   runtime:
  #     go: 1.14

  # experimental:
  #   env:
  #     GO111MODULE: auto

  tasks:

    - name: misspell_shell
      type: shell
      commands:
        - sudo apt-get update && sudo apt-get install -y curl
        - curl -L -o ./install-misspell.sh https://git.io/misspell
        - sh ./install-misspell.sh
        - ls -l ./bin/misspell
        - REPODIR="$(pwd)"
        - OUTDIR="${REPODIR}/.reports"
        - OUTFILE="${OUTDIR}/misspell.issues"
        - echo +++ REPODIR is "${REPODIR}"
        - echo +++ OUTDIR is "${OUTDIR}"
        - echo +++ OUTFILE is "${OUTFILE}"
        - mkdir -p "${OUTDIR}"
        - find . -type f -print | xargs ./bin/misspell > "${OUTFILE}"
        - ls -al "${OUTDIR}"
        - (echo "========" ; cat -n "${OUTFILE}" ; echo "========")
      artifacts:
        uploads:
          - path: '.reports/misspell.issues'
      reports:
        - path: '.reports/misspell.issues'
          format: {type: example, path: '.rocro/misspell/issues.example'}
      thresholds: {num-issues: 9}

