---
inspecode:

  tasks:

    - name: dflint_docker
      type: docker-build
      dockerfile: '.rocro/dflint/Dockerfile'
      options:
        --context: .
        --build-arg: [OUTDIR=/.reports]
      artifacts:
        uploads:
          - stage: linter-stage
            path: '/.reports/'
      reports:
        - stage: linter-stage
          path: '/.reports/dockerfilelint.sarif'
      thresholds: {num-issues: 2}

    - name: hadolint_docker
      type: docker-build
      dockerfile: '.rocro/hadolint/Dockerfile'
      options:
        --context: .
        --build-arg: [OUTDIR=/.reports]
      artifacts:
        uploads:
          - stage: linter-stage
            path: '/.reports/'
      reports:
        - stage: linter-stage
          path: '/.reports/hadolint.sarif'
      thresholds: {num-issues: 13}

    - name: misspell_shell
      type: shell
      commands:
        - sudo apt-get update && sudo apt-get install -y curl
        - curl -L -o ./install-misspell.sh https://git.io/misspell
        - sh ./install-misspell.sh
        - ls -l ./bin/misspell
        - REPODIR="$(pwd)"
        - OUTDIR="${REPODIR}/.reports"
        - OUTFILE="${OUTDIR}/misspell.issues"
        - echo +++ REPODIR is "${REPODIR}"
        - echo +++ OUTDIR is "${OUTDIR}"
        - echo +++ OUTFILE is "${OUTFILE}"
        - mkdir -p "${OUTDIR}"
        - find . -type f -print | xargs ./bin/misspell > "${OUTFILE}"
        - ls -al "${OUTDIR}"
        - (echo "========" ; cat -n "${OUTFILE}" ; echo "========")
      artifacts:
        uploads:
          - path: '.reports/misspell.issues'
      reports:
        - path: '.reports/misspell.issues'
          format: {type: example, path: '.rocro/misspell/issues.example'}
      thresholds: {num-issues: 9}

    - name: sql-lint_docker
      type: docker-build
      dockerfile: '.rocro/sqllint/Dockerfile'
      options:
        --context: .
        --build-arg: [OUTDIR=/.reports]
      artifacts:
        uploads:
          - stage: linter-stage
            path: '/.reports/'
      reports:
        - stage: linter-stage
          path: '/.reports/sql-lint.sarif'
      thresholds: {num-issues: 14}

    - name: sql-lint_shell
      type: shell
      commands:
        - sudo apt-get update && sudo apt-get install -y nodejs npm
        - echo "+++ node .. $(node --version)"
        - echo "+++ npm .. $(npm --version)"
        - sudo npm install --global typescript
        - echo "+++ tsc .. $(tsc --version)"
        - sudo npm install --global sql-lint
        - echo "+++ sql-lint .. $(sql-lint --version)"
        - REPODIR="$(pwd)"
        - OUTDIR="${REPODIR}/.reports"
        - OUTFILE="${OUTDIR}/sqllint.issues"
        - echo +++ REPODIR is "${REPODIR}"
        - echo +++ OUTDIR is "${OUTDIR}"
        - echo +++ OUTFILE is "${OUTFILE}"
        - mkdir -p "${OUTDIR}"
        - ( find . -type f -name '*.sql' -print0 | xargs -0 -n 1 sql-lint --format simple ) > "${OUTFILE}" || true
        - ls -al "${OUTDIR}"
        - (echo "========" ; cat -n "${OUTFILE}" ; echo "========")
      artifacts:
        uploads:
          - path: '.reports/sqllint.issues'
      reports:
        - path: '.reports/sqllint.issues'
          format: {type: example, path: '.rocro/sqllint/issues.example'}
      thresholds: {num-issues: 14}

    - name: yamllint_docker
      type: docker-build
      dockerfile: '.rocro/yamllint/Dockerfile'
      options:
        --context: .
        --build-arg: [OUTDIR=/.reports]
      artifacts:
        uploads:
          - stage: linter-stage
            path: '/.reports/'
      reports:
        - stage: linter-stage
          path: '/.reports/yamllint.sarif'
      thresholds: {num-issues: 3}

    - name: yamllint_shell
      type: shell
      commands:
        - sudo apt-get update && sudo apt-get install -y yamllint
        - echo "+++ $(yamllint --version)"
        - REPODIR="$(pwd)"
        - OUTDIR="${REPODIR}/.reports"
        - OUTFILE="${OUTDIR}/yamllint.issues"
        - echo +++ REPODIR is "${REPODIR}"
        - echo +++ OUTDIR is "${OUTDIR}"
        - echo +++ OUTFILE is "${OUTFILE}"
        - mkdir -p "${OUTDIR}"
        - yamllint -f parsable . > "${OUTFILE}" || true
        - ls -la "${OUTDIR}"
        - (echo "========" ; cat -n "${OUTFILE}" ; echo "========")
      artifacts:
        uploads:
          - path: '.reports/yamllint.issues'
      reports:
        - path: '.reports/yamllint.issues'
          format: {type: example, path: '.rocro/yamllint/issues.example'}
      thresholds: {num-issues: 2}

  tools:

    clang-format:
      auto-fix: true
      thresholds: {num-issues: 75}

    # fortify:
    #   thresholds: {num-issues: 999}

    fossid:
      thresholds: {num-issues: 16}

    fossology:
      thresholds: {num-issues: 27}

    grep:
      thresholds: {num-issues: 0}

    jscpd:
      thresholds: {num-issues: 15}

    misspell:
      auto-fix: true
      thresholds: {num-issues: 1}

    prettier:
      auto-fix: true
      thresholds: {num-issues: 7}

    tslint:
      auto-fix: true
      thresholds: {num-issues: 19}
