    #   reports:
    #     - stage: linter-stage
    #       path: "/.reports/yamllint.sarif"
    #   thresholds: {num-issues: 3}

    - name: yamllint_shell
      type: shell
      commands:
        - sudo apt-get update && sudo apt-get install -y python pip
        - echo "+++ python .. $(python --version)"
        - echo "+++ pip .. $(pip --version)"
        - pip install 'yamllint>=1.24.0,<1.25.0'
        - echo "+++ $(yamllint --version)"
        - REPODIR="$(pwd)"
        - OUTDIR="${REPODIR}/.reports"
        - OUTFILE="${OUTDIR}/yamllint.issues"
        - echo +++ REPODIR is "${REPODIR}"
        - echo +++ OUTDIR is "${OUTDIR}"
        - echo +++ OUTFILE is "${OUTFILE}"
        - mkdir -p "${OUTDIR}"
        - yamllint -f parsable . > "${OUTFILE}" || true
        - ls -la "${OUTDIR}"
        - (echo "========" ; cat -n "${OUTFILE}" ; echo "========")
      artifacts:
        uploads:
          - stage: linter-stage
            path: "/.reports/"
      reports:
        - stage: linter-stage
          path: "/.reports/yamllint.sarif"
      thresholds: {num-issues: 999}

  tools:

    clang-format:
      auto-fix: true
      thresholds: {num-issues: 75}

